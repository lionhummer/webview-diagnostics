[package]
name = "webview-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Bounded WebView diagnostics with redaction, SQLite journals and optional macOS capture"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lionhummer/webview-diagnostics"
readme = "README.md"
[features]
default = []
webkit = ["dep:objc2", "dep:block2", "dep:objc2-foundation", "dep:objc2-web-kit", "dep:plist", "dep:tokio", "dep:log", "dep:objc2-app-kit"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
http = "1"
url = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v7"] }
[target.'cfg(target_os="macos")'.dependencies]
objc2-app-kit = { version = "0.3", optional = true }
objc2 = { version = "0.6", optional = true }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true }
objc2-web-kit = { version = "0.3", optional = true }
plist = { version = "1.8", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time"], optional = true }
log = { version = "0.4", optional = true }

[[example]]
name = "webkit_smoke"
required-features = ["webkit"]
